name: HomiGo SDK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-sdk:
    name: Validate Core SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Core SDK dependencies
        run: flutter pub get

      - name: Check Core SDK formatting
        run: dart format --output=none --set-exit-if-changed lib test example/lib

      - name: Analyze Core SDK
        run: flutter analyze lib test example/lib

      - name: Test Core SDK
        run: flutter test

      - name: Validate Core SDK publication
        run: dart pub publish --dry-run

  firebase-sdk:
    name: Validate Firebase SDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/homigo_sdk_firebase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Firebase SDK dependencies
        run: flutter pub get

      - name: Check Firebase SDK formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Firebase SDK
        run: flutter analyze

      - name: Test Firebase SDK
        run: flutter test