name: HomiGo SDK CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core-sdk:
    name: Analyze and Test Core SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Core SDK dependencies
        run: flutter pub get

      - name: Analyze Core SDK
        run: flutter analyze

      - name: Test Core SDK
        run: flutter test

  firebase-sdk:
    name: Analyze and Test Firebase SDK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: packages/homigo_sdk_firebase

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Firebase SDK dependencies
        run: flutter pub get

      - name: Analyze Firebase SDK
        run: flutter analyze

      - name: Test Firebase SDK
        run: flutter test
